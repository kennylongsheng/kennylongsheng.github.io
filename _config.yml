# Site settings. Restart the local Jekyll server after changing this file.
title: "KennyLongSheng"
email: kennylongsheng@gmail.com
description: "Engineering, learning, and personal projects."
baseurl: ""
url: "https://kennylongsheng.github.io"
github_username: kennylongsheng

# Keep the existing theme and RSS feed.
theme: minima
plugins:
  - jekyll-feed
  - jekyll-redirect-from

header_pages:
  - cv.markdown
  - blog.markdown
  - about.markdown

# Development files are not part of the published website.
exclude:
  - README.md
  - memory.md
  - jekyll_livereload.sh
  - tests
  - Personal
  - vendor
